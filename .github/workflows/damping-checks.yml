name: Damping experiment checks
on:
  push:
    paths: ['RRN_functions.py', 'experiments/damping/**', '.github/workflows/damping-checks.yml']
  pull_request:
    paths: ['RRN_functions.py', 'experiments/damping/**', '.github/workflows/damping-checks.yml']
jobs:
  scientific-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy
      - run: python -m unittest experiments.damping.test_experiment -v
